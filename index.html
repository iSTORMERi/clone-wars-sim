<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clone Wars Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2332;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            line-height: 1.6;
        }
        #ui .rep { color: #ff6666; }
        #ui .cis { color: #66aaff; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div><span class="rep">🔴 Республика:</span> <span id="repCount">0</span>/9</div>
        <div><span class="cis">🔵 КНС:</span> <span id="cisCount">0</span>/32</div>
        <div style="margin-top:6px; font-size:12px; opacity:0.7;">Зум: <span id="zoomLevel">100%</span></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // ==================== НАСТРОЙКИ КАРТЫ ====================
        const MAP_WIDTH = 4000;
        const MAP_HEIGHT = 2400;

        let cameraX = MAP_WIDTH / 2 - window.innerWidth / 2;
        let cameraY = MAP_HEIGHT / 2 - window.innerHeight / 2;
        let zoom = 1;

        // ==================== НАСТРОЙКИ ЮНИТОВ ====================
        const CLONE_CONFIG = {
            side: 'republic',
            color: '#ffffff',
            shape: 'circle',
            radius: 7,
            hp: 3,
            speed: 1.8,
            accuracy: 0.85,
            fireRate: 40,
            detectRange: 250,
            fireRange: 220,
            respawnDelay: 180,
            boltColor: '#4a9eff',
            boltSpeed: 8
        };

        const DROID_CONFIG = {
            side: 'cis',
            color: '#c9a96e',
            shape: 'oval',
            radius: 6,
            hp: 1,
            speed: 1.0,
            accuracy: 0.40,
            fireRate: 50,
            detectRange: 200,
            fireRange: 180,
            respawnDelay: 120,
            boltColor: '#ff3030',
            boltSpeed: 6
        };

        // ==================== БАЗЫ И ТОЧКА ЗАХВАТА ====================
        const bases = {
            republic: { x: 3400, y: 1200, color: '#ff3030', name: 'РЕСПУБЛИКА' },
            cis: { x: 600, y: 1200, color: '#4a9eff', name: 'КНС' }
        };

        const capturePoint = {
            x: 2000,
            y: 1200,
            radius: 80,
            pulsePhase: 0
        };

        // ==================== ИГРОВЫЕ ОБЪЕКТЫ ====================
        let units = [];
        let bullets = [];
        let particles = [];
        let grenades = [];
        let explosions = [];

        // ==================== КЛАСС ЮНИТА ====================
        class Unit {
            constructor(config, x, y, formationOffset = null, isMedic = false) {
                this.side = config.side;
                this.color = config.color;
                this.shape = config.shape;
                this.radius = config.radius;
                this.maxHp = config.hp;
                this.hp = config.hp;
                this.speed = config.speed;
                this.accuracy = config.accuracy;
                this.fireRate = config.fireRate;
                this.detectRange = config.detectRange;
                this.fireRange = config.fireRange;
                this.respawnDelay = config.respawnDelay;
                this.boltColor = config.boltColor;
                this.boltSpeed = config.boltSpeed;
                
                this.x = x;
                this.y = y;
                this.formationOffset = formationOffset;
                this.cooldown = Math.random() * config.fireRate;
                this.alive = true;
                this.respawnTimer = 0;
                this.target = null;
                this.isMedic = isMedic;
                
                this.wanderAngle = Math.random() * Math.PI * 2;
                this.wanderTimer = 0;
                
                // Гранаты (только для клонов)
                this.empGrenades = 0;
                this.thermalGrenades = 0;
                this.grenadeCooldown = 0;
                
                // Для дроидов - отслеживание формации
                this.inFormation = false;
                this.fireIndex = 0; // индекс в очереди стрельбы
            }

            assignGrenades() {
                if (this.side !== 'republic' || this.isMedic) return;
                this.empGrenades = 3;
                this.thermalGrenades = 2;
            }

            respawn(baseX, baseY) {
                this.hp = this.maxHp;
                this.alive = true;
                this.cooldown = Math.random() * this.fireRate;
                this.x = baseX + (Math.random() - 0.5) * 100;
                this.y = baseY + (Math.random() - 0.5) * 100;
                this.assignGrenades();
                this.grenadeCooldown = 0;
            }

            findNearestEnemy() {
                let nearest = null;
                let minDist = Infinity;
                for (const u of units) {
                    if (u.alive && u.side !== this.side) {
                        const d = Math.hypot(u.x - this.x, u.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            nearest = u;
                        }
                    }
                }
                return { unit: nearest, dist: minDist };
            }

            findMedic() {
                let nearest = null;
                let minDist = Infinity;
                for (const u of units) {
                    if (u.alive && u.side === this.side && u.isMedic) {
                        const d = Math.hypot(u.x - this.x, u.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            nearest = u;
                        }
                    }
                }
                return { medic: nearest, dist: minDist };
            }

            findWoundedAlly() {
                let nearest = null;
                let minDist = Infinity;
                for (const u of units) {
                    if (u.alive && u.side === this.side && u.hp < u.maxHp && !u.isMedic) {
                        const d = Math.hypot(u.x - this.x, u.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            nearest = u;
                        }
                    }
                }
                return { ally: nearest, dist: minDist };
            }

            countEnemiesInRange(range) {
                let count = 0;
                for (const u of units) {
                    if (u.alive && u.side !== this.side) {
                        const d = Math.hypot(u.x - this.x, u.y - this.y);
                        if (d < range) count++;
                    }
                }
                return count;
            }

            update() {
                if (!this.alive) {
                    this.respawnTimer--;
                    if (this.respawnTimer <= 0) {
                        const base = bases[this.side];
                        this.respawn(base.x, base.y);
                    }
                    return;
                }

                const { unit: enemy, dist } = this.findNearestEnemy();
                this.target = enemy;

                if (this.side === 'republic') {
                    this.updateCloneBehavior(enemy, dist);
                } else {
                    this.updateDroidBehavior(enemy, dist);
                }

                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));

                this.cooldown--;
                if (this.cooldown <= 0 && enemy && dist < this.fireRange) {
                    this.shoot(enemy);
                    this.cooldown = this.fireRate + Math.random() * 20;
                }

                if (this.grenadeCooldown > 0) this.grenadeCooldown--;
            }

            updateCloneBehavior(enemy, dist) {
                // Медик ищет раненых
                if (this.isMedic) {
                    const { ally, dist: allyDist } = this.findWoundedAlly();
                    if (ally && allyDist < this.detectRange) {
                        const dx = ally.x - this.x;
                        const dy = ally.y - this.y;
                        const len = Math.hypot(dx, dy);
                        if (len > 15) {
                            this.x += (dx / len) * this.speed;
                            this.y += (dy / len) * this.speed;
                        }
                        // Лечение при контакте
                        if (len <= 15 && ally.hp < ally.maxHp) {
                            ally.hp = Math.min(ally.maxHp, ally.hp + 0.02);
                            return; // не стреляем пока лечим
                        }
                    } else {
                        // Нет раненых - идём к точке захвата
                        this.moveToCapturePoint();
                    }
                    return;
                }

                // Раненый клон ищет медика
                if (this.hp < this.maxHp) {
                    const { medic, dist: medicDist } = this.findMedic();
                    if (medic && medicDist < this.detectRange) {
                        const dx = medic.x - this.x;
                        const dy = medic.y - this.y;
                        const len = Math.hypot(dx, dy);
                        if (len > 15) {
                            this.x += (dx / len) * this.speed;
                            this.y += (dy / len) * this.speed;
                        }
                        return; // не стреляем пока идём к медику
                    } else {
                        // Нет медика - отступаем на базу
                        const base = bases.republic;
                        const dx = base.x - this.x;
                        const dy = base.y - this.y;
                        const len = Math.hypot(dx, dy);
                        if (len > 50) {
                            this.x += (dx / len) * this.speed;
                            this.y += (dy / len) * this.speed;
                        } else {
                            // На базе постепенно лечимся
                            this.hp = Math.min(this.maxHp, this.hp + 0.01);
                        }
                        return;
                    }
                }

                // Здоровый клон - бросаем гранаты если нужно
                this.tryThrowGrenade();

                // Движение к точке захвата с зигзагом
                this.moveToCapturePoint();

                // Подстраховка: отталкивание от союзников
                for (const u of units) {
                    if (u.alive && u.side === this.side && u !== this) {
                        const d = Math.hypot(u.x - this.x, u.y - this.y);
                        if (d < 25 && d > 0) {
                            const pushX = (this.x - u.x) / d;
                            const pushY = (this.y - u.y) / d;
                            this.x += pushX * 0.5;
                            this.y += pushY * 0.5;
                        }
                    }
                }
            }

            moveToCapturePoint() {
                const tx = capturePoint.x;
                const ty = capturePoint.y;
                const dx = tx - this.x;
                const dy = ty - this.y;
                const len = Math.hypot(dx, dy);

                if (len > 30) {
                    this.wanderTimer--;
                    if (this.wanderTimer <= 0) {
                        this.wanderAngle = (Math.random() - 0.5) * 1.5;
                        this.wanderTimer = 30 + Math.random() * 60;
                    }

                    const perpX = -dy / len;
                    const perpY = dx / len;
                    const wanderStrength = 0.4;

                    this.x += ((dx / len) + perpX * Math.sin(this.wanderAngle) * wanderStrength) * this.speed;
                    this.y += ((dy / len) + perpY * Math.sin(this.wanderAngle) * wanderStrength) * this.speed;
                }
            }

            tryThrowGrenade() {
                if (this.grenadeCooldown > 0) return;
                if (this.empGrenades <= 0 && this.thermalGrenades <= 0) return;

                const enemyCount = this.countEnemiesInRange(this.detectRange);
                if (enemyCount < 5) return;

                // Проверяем, не летит ли уже граната в эту область
                const grenadeInArea = grenades.some(g => {
                    const d = Math.hypot(g.x - this.x, g.y - this.y);
                    return d < 200 && g.side === this.side;
                });
                if (grenadeInArea) return;

                // Бросаем гранату
                const enemy = this.target;
                if (!enemy) return;

                if (this.empGrenades > 0 && Math.random() < 0.6) {
                    this.throwGrenade('emp', enemy.x, enemy.y);
                    this.empGrenades--;
                } else if (this.thermalGrenades > 0) {
                    this.throwGrenade('thermal', enemy.x, enemy.y);
                    this.thermalGrenades--;
                }

                this.grenadeCooldown = 180; // 3 секунды задержки
            }

            throwGrenade(type, targetX, targetY) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const len = Math.hypot(dx, dy);
                grenades.push({
                    x: this.x,
                    y: this.y,
                    vx: (dx / len) * 4,
                    vy: (dy / len) * 4,
                    type: type,
                    side: this.side,
                    life: 90,
                    targetX: targetX,
                    targetY: targetY
                });
            }

            updateDroidBehavior(enemy, dist) {
                // Проверяем сформированность
                const formationStatus = this.checkFormation();
                this.inFormation = formationStatus.inPosition;

                const tx = capturePoint.x;
                const ty = capturePoint.y;

                let targetX = tx;
                let targetY = ty;
                if (this.formationOffset) {
                    targetX += this.formationOffset.x;
                    targetY += this.formationOffset.y;
                }

                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const len = Math.hypot(dx, dy);

                if (len > 20) {
                    this.x += (dx / len) * this.speed;
                    this.y += (dy / len) * this.speed;
                }

                // Возврат в строй
                if (this.formationOffset && len <= 20) {
                    const idealX = tx + this.formationOffset.x;
                    const idealY = ty + this.formationOffset.y;
                    const idX = idealX - this.x;
                    const idY = idealY - this.y;
                    const idLen = Math.hypot(idX, idY);
                    if (idLen > 5) {
                        this.x += (idX / idLen) * this.speed * 0.3;
                        this.y += (idY / idLen) * this.speed * 0.3;
                    }
                }
            }

            checkFormation() {
                if (!this.formationOffset) return { inPosition: false, percentage: 0 };
                
                const tx = capturePoint.x;
                const ty = capturePoint.y;
                const idealX = tx + this.formationOffset.x;
                const idealY = ty + this.formationOffset.y;
                const d = Math.hypot(idealX - this.x, idealY - this.y);
                
                return {
                    inPosition: d < 30,
                    distance: d
                };
            }

            shoot(enemy) {
                // Медик стреляет реже
                const fireChance = this.isMedic ? 0.3 : 1.0;
                if (Math.random() > fireChance) return;

                if (Math.random() > this.accuracy) {
                    const spread = 30;
                    const targetX = enemy.x + (Math.random() - 0.5) * spread;
                    const targetY = enemy.y + (Math.random() - 0.5) * spread;
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const len = Math.hypot(dx, dy);
                    bullets.push({
                        x: this.x, y: this.y,
                        vx: (dx / len) * this.boltSpeed,
                        vy: (dy / len) * this.boltSpeed,
                        side: this.side,
                        color: this.boltColor,
                        life: 60
                    });
                    return;
                }

                const dx = enemy.x - this.x;
                const dy = enemy.y - this.y;
                const len = Math.hypot(dx, dy);
                bullets.push({
                    x: this.x, y: this.y,
                    vx: (dx / len) * this.boltSpeed,
                    vy: (dy / len) * this.boltSpeed,
                    side: this.side,
                    color: this.boltColor,
                    life: 60,
                    target: enemy
                });
            }

            draw() {
                if (!this.alive) return;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + this.radius, this.radius, this.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.shape === 'circle') {
                    ctx.fillStyle = this.color;
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Красный крест для медика
                    if (this.isMedic) {
                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(this.x - 2, this.y - 5, 4, 10);
                        ctx.fillRect(this.x - 5, this.y - 2, 10, 4);
                    }
                } else {
                    ctx.fillStyle = this.color;
                    ctx.strokeStyle = '#8b7355';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(this.x, this.y, this.radius * 0.7, this.radius * 1.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Индикатор формации
                    if (this.inFormation) {
                        ctx.fillStyle = '#00ff00';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y - this.radius * 1.4 - 5, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (this.hp < this.maxHp) {
                    const bw = 14, bh = 2;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(this.x - bw / 2, this.y - this.radius - 8, bw, bh);
                    ctx.fillStyle = this.hp > 1 ? '#0f0' : '#f00';
                    ctx.fillRect(this.x - bw / 2, this.y - this.radius - 8, bw * (this.hp / this.maxHp), bh);
                }
            }
        }

        // ==================== СОЗДАНИЕ АРМИЙ ====================
        function createArmies() {
            units = [];

            const repBase = bases.republic;
            for (let i = 0; i < 9; i++) {
                const angle = (i / 9) * Math.PI * 2;
                const x = repBase.x + Math.cos(angle) * 60;
                const y = repBase.y + Math.sin(angle) * 60;
                const isMedic = (i === 0); // первый клон - медик
                const unit = new Unit(CLONE_CONFIG, x, y, null, isMedic);
                unit.assignGrenades();
                units.push(unit);
            }

            const cisBase = bases.cis;
            const colSpacing = 20;
            const rowSpacing = 20;
            const cols = 4;
            const rows = 8;
            const startX = cisBase.x - ((cols - 1) * colSpacing) / 2;
            const startY = cisBase.y - ((rows - 1) * rowSpacing) / 2;

            let fireIndex = 0;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = startX + col * colSpacing;
                    const y = startY + row * rowSpacing;
                    const formationOffset = {
                        x: (col - (cols - 1) / 2) * colSpacing,
                        y: (row - (rows - 1) / 2) * rowSpacing
                    };
                    const unit = new Unit(DROID_CONFIG, x, y, formationOffset);
                    unit.fireIndex = fireIndex++;
                    units.push(unit);
                }
            }
        }

        // ==================== ОБНОВЛЕНИЕ ПУЛЬ ====================
        function updateBullets() {
            for (const b of bullets) {
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                if (b.target && b.target.alive) {
                    const d = Math.hypot(b.target.x - b.x, b.target.y - b.y);
                    if (d < b.target.radius + 3) {
                        b.target.hp--;
                        b.life = 0;
                        createExplosion(b.x, b.y, b.color);
                        if (b.target.hp <= 0) {
                            b.target.alive = false;
                            b.target.respawnTimer = b.target.respawnDelay;
                            createExplosion(b.target.x, b.target.y, b.target.color, 15);
                        }
                    }
                } else {
                    for (const u of units) {
                        if (u.alive && u.side !== b.side) {
                            const d = Math.hypot(u.x - b.x, u.y - b.y);
                            if (d < u.radius + 3) {
                                u.hp--;
                                b.life = 0;
                                createExplosion(b.x, b.y, b.color);
                                if (u.hp <= 0) {
                                    u.alive = false;
                                    u.respawnTimer = u.respawnDelay;
                                    createExplosion(u.x, u.y, u.color, 15);
                                }
                                break;
                            }
                        }
                    }
                }
            }
            bullets = bullets.filter(b => b.life > 0 && b.x > 0 && b.x < MAP_WIDTH && b.y > 0 && b.y < MAP_HEIGHT);
        }

        // ==================== ГРАНАТЫ ====================
        function updateGrenades() {
            for (const g of grenades) {
                g.x += g.vx;
                g.y += g.vy;
                g.life--;

                if (g.life <= 0) {
                    // Взрыв
                    if (g.type === 'emp') {
                        explosions.push({
                            x: g.x, y: g.y,
                            type: 'emp',
                            radius: 100,
                            life: 60,
                            maxLife: 60
                        });
                        // Урон дроидам
                        for (const u of units) {
                            if (u.alive && u.side === 'cis') {
                                const d = Math.hypot(u.x - g.x, u.y - g.y);
                                if (d < 100) {
                                    u.hp = 0;
                                    u.alive = false;
                                    u.respawnTimer = u.respawnDelay;
                                    createExplosion(u.x, u.y, '#00ffff', 20);
                                }
                            }
                        }
                    } else {
                        explosions.push({
                            x: g.x, y: g.y,
                            type: 'thermal',
                            radius: 80,
                            life: 90,
                            maxLife: 90
                        });
                        // Урон всем
                        for (const u of units) {
                            if (u.alive) {
                                const d = Math.hypot(u.x - g.x, u.y - g.y);
                                if (d < 80) {
                                    u.hp -= 2;
                                    createExplosion(u.x, u.y, '#ff6600', 10);
                                    if (u.hp <= 0) {
                                        u.alive = false;
                                        u.respawnTimer = u.respawnDelay;
                                        createExplosion(u.x, u.y, u.color, 15);
                                    }
                                }
                            }
                        }
                    }
                }
            }
            grenades = grenades.filter(g => g.life > 0);
        }

        // ==================== ЧАСТИЦЫ ====================
        function createExplosion(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 20 + Math.random() * 15,
                    color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        function updateParticles() {
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.size *= 0.95;
            }
            particles = particles.filter(p => p.life > 0);
        }

        function updateExplosions() {
            for (const e of explosions) {
                e.life--;
            }
            explosions = explosions.filter(e => e.life > 0);
        }

        // ==================== ОТРИСОВКА ====================
        function drawBuilding(x, y, width, height, color, name) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(x + 8, y + 8, width, height);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(x + 15, y + 15, width - 30, height - 30);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name, x + width / 2, y - 15);
        }

        function drawCapturePoint() {
            const { x, y, radius, pulsePhase } = capturePoint;
            const pulseSize = Math.sin(pulsePhase) * 10;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, radius + 20 + pulseSize, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ЗАХВАТ', x, y - radius - 30);
        }

        function drawBullet(b) {
            const angle = Math.atan2(b.vy, b.vx);
            const length = 14;
            const width = 4;

            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(angle);

            ctx.fillStyle = b.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = b.color;

            ctx.beginPath();
            ctx.moveTo(length / 2, 0);
            ctx.lineTo(0, width / 2);
            ctx.lineTo(-length / 2, 0);
            ctx.lineTo(0, -width / 2);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawGrenade(g) {
            ctx.save();
            ctx.translate(g.x, g.y);

            if (g.type === 'emp') {
                // Синий цилиндр с молнией
                ctx.fillStyle = '#00aaff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00aaff';
                ctx.fillRect(-6, -4, 12, 8);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-3, -2);
                ctx.lineTo(0, 0);
                ctx.lineTo(-2, 2);
                ctx.lineTo(2, 0);
                ctx.stroke();
            } else {
                // Серебристый шар
                ctx.fillStyle = '#cccccc';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ff0000';
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(0, 0, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawExplosion(e) {
            const progress = 1 - (e.life / e.maxLife);
            const currentRadius = e.radius * progress;

            ctx.save();
            ctx.translate(e.x, e.y);

            if (e.type === 'emp') {
                // Электрическое поле с молниями
                ctx.strokeStyle = `rgba(0, 200, 255, ${e.life / e.maxLife})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Молнии
                ctx.strokeStyle = `rgba(255, 255, 255, ${e.life / e.maxLife})`;
                ctx.lineWidth = 2;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + progress * 10;
                    const length = currentRadius * (0.5 + Math.random() * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
                    ctx.stroke();
                }
            } else {
                // Огонь и дым
                const fireRadius = currentRadius * 0.6;
                const smokeRadius = currentRadius;

                // Дым
                ctx.fillStyle = `rgba(100, 100, 100, ${e.life / e.maxLife * 0.5})`;
                ctx.beginPath();
                ctx.arc(0, 0, smokeRadius, 0, Math.PI * 2);
                ctx.fill();

                // Огонь
                ctx.fillStyle = `rgba(255, 100, 0, ${e.life / e.maxLife})`;
                ctx.beginPath();
                ctx.arc(0, 0, fireRadius, 0, Math.PI * 2);
                ctx.fill();

                // Яркий центр
                ctx.fillStyle = `rgba(255, 255, 200, ${e.life / e.maxLife})`;
                ctx.beginPath();
                ctx.arc(0, 0, fireRadius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawMap() {
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);
            ctx.translate(-cameraX, -cameraY);

            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
            ctx.strokeStyle = '#2a3b4c';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            const bs = 180;
            drawBuilding(bases.cis.x - bs / 2, bases.cis.y - bs / 2, bs, bs, bases.cis.color, bases.cis.name);
            drawBuilding(bases.republic.x - bs / 2, bases.republic.y - bs / 2, bs, bs, bases.republic.color, bases.republic.name);

            drawCapturePoint();

            for (const u of units) u.draw();
            for (const b of bullets) drawBullet(b);
            for (const g of grenades) drawGrenade(g);
            for (const e of explosions) drawExplosion(e);

            for (const p of particles) {
                ctx.globalAlpha = p.life / 35;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        // ==================== ГЛАВНЫЙ ЦИКЛ ====================
        function update() {
            for (const u of units) u.update();
            updateBullets();
            updateGrenades();
            updateParticles();
            updateExplosions();
            capturePoint.pulsePhase += 0.05;
        }

        function updateUI() {
            const repAlive = units.filter(u => u.side === 'republic' && u.alive).length;
            const cisAlive = units.filter(u => u.side === 'cis' && u.alive).length;
            document.getElementById('repCount').textContent = repAlive;
            document.getElementById('cisCount').textContent = cisAlive;
            document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
        }

        function loop() {
            update();
            drawMap();
            updateUI();
            requestAnimationFrame(loop);
        }

        // ==================== УПРАВЛЕНИЕ КАМЕРОЙ ====================
        let isDragging = false;
        let lastX = 0, lastY = 0;
        let initialPinchDistance = 0, initialZoom = 1;

        function getDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
                initialZoom = zoom;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const cx = e.touches[0].clientX;
                const cy = e.touches[0].clientY;
                cameraX -= (cx - lastX) / zoom;
                cameraY -= (cy - lastY) / zoom;
                lastX = cx;
                lastY = cy;
            } else if (e.touches.length === 2) {
                const d = getDistance(e.touches[0], e.touches[1]);
                zoom = Math.max(0.3, Math.min(3, initialZoom * (d / initialPinchDistance)));
            }
        });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) isDragging = false;
        });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            cameraX -= (e.clientX - lastX) / zoom;
            cameraY -= (e.clientY - lastY) / zoom;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoom = Math.min(3, zoom + 0.1);
            else zoom = Math.max(0.3, zoom - 0.1);
        });

        // ==================== ЗАПУСК ====================
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        createArmies();
        loop();
    </script>
</body>
</html>
