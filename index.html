<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamino Simulation - Map</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050a14; /* Темный фон подложки */
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Настройки сетки Камино
        const TILE_SIZE = 120; // Размер одной плиты
        const GAP_SIZE = 4;    // Ширина неоновой линии

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMap();
        }

        function drawMap() {
            // Очищаем экран темным фоном (это будет цвет "щелей")
            ctx.fillStyle = '#050a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем серые плиты
            ctx.fillStyle = '#2a3b4c'; // Цвет платформ Камино
            
            // Вычисляем количество плит по ширине и высоте
            const cols = Math.ceil(canvas.width / (TILE_SIZE + GAP_SIZE));
            const rows = Math.ceil(canvas.height / (TILE_SIZE + GAP_SIZE));

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * (TILE_SIZE + GAP_SIZE) + GAP_SIZE / 2;
                    const y = j * (TILE_SIZE + GAP_SIZE) + GAP_SIZE / 2;
                    
                    // Рисуем плиту
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }

            // Добавляем легкое свечение на стыках для эффекта неона
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 1;
            
            // Можно раскомментировать этот блок, если хочешь явные белые линии поверх щелей
            /*
            for (let i = 0; i <= cols; i++) {
                const x = i * (TILE_SIZE + GAP_SIZE);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j <= rows; j++) {
                const y = j * (TILE_SIZE + GAP_SIZE);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            */
            ctx.shadowBlur = 0; // Сброс эффектов
        }

        // Инициализация
        window.addEventListener('resize', resize);
        resize(); // Первый запуск отрисовки

    </script>
</body>
</html>
