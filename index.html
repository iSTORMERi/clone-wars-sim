<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamino Simulation - Outposts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2332;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Размер карты
        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 1200;

        // Позиция камеры (стартуем в центре карты)
        let cameraX = MAP_WIDTH / 2 - window.innerWidth / 2;
        let cameraY = MAP_HEIGHT / 2 - window.innerHeight / 2;

        // Для перемещения пальцем
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        // Аванпосты (поменяли местами: КНС слева, Республика справа)
        const outposts = {
            republic: {
                x: 1600,
                y: 600,
                color: '#4a9eff',
                name: 'РЕСПУБЛИКА'
            },
            cis: {
                x: 400,
                y: 600,
                color: '#ff3030',
                name: 'КНС'
            }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMap();
        }

        function drawBuilding(x, y, width, height, color, name) {
            // Тень здания
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(x + 8, y + 8, width, height);

            // Основное здание
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);

            // Обводка
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);

            // Внутренняя деталь
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(x + 15, y + 15, width - 30, height - 30);

            // Название
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name, x + width / 2, y - 15);
        }

        function drawMap() {
            // Очистка экрана
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Рисуем карту
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Граница карты
            ctx.strokeStyle = '#2a3b4c';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Рисуем аванпосты
            const buildingSize = 180;
            
            drawBuilding(
                outposts.cis.x - buildingSize / 2,
                outposts.cis.y - buildingSize / 2,
                buildingSize,
                buildingSize,
                outposts.cis.color,
                outposts.cis.name
            );

            drawBuilding(
                outposts.republic.x - buildingSize / 2,
                outposts.republic.y - buildingSize / 2,
                buildingSize,
                buildingSize,
                outposts.republic.color,
                outposts.republic.name
            );

            ctx.restore();
        }

        // Управление камерой
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            cameraX -= (currentX - lastX);
            cameraY -= (currentY - lastY);
            
            lastX = currentX;
            lastY = currentY;
            
            drawMap();
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            cameraX -= (e.clientX - lastX);
            cameraY -= (e.clientY - lastY);
            
            lastX = e.clientX;
            lastY = e.clientY;
            
            drawMap();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Запуск
        window.addEventListener('resize', resize);
        resize();
        drawMap();

    </script>
</body>
</html>
