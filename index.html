<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamino Simulation - Map</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050a14; /* Темный фон "щелей" */
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // НАСТРОЙКИ СЕТКИ КАМИНО
        const TILE_SIZE = 30;  // Размер одной маленькой плиты (было 120)
        const GAP_SIZE = 2;    // Толщина неоновой линии (было 4)

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMap();
        }

        function drawMap() {
            // 1. Рисуем темный фон (это будут наши светящиеся линии)
            ctx.fillStyle = '#050a14'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Рисуем серые плиты поверх фона
            ctx.fillStyle = '#2a3b4c'; 
            
            // Вычисляем сколько плит влезет на экран
            const cols = Math.ceil(canvas.width / (TILE_SIZE + GAP_SIZE));
            const rows = Math.ceil(canvas.height / (TILE_SIZE + GAP_SIZE));

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * (TILE_SIZE + GAP_SIZE);
                    const y = j * (TILE_SIZE + GAP_SIZE);
                    
                    // Рисуем каждую маленькую плиту
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }

            // 3. Добавляем легкое свечение для эффекта неона
            // (рисуем полупрозрачные белые прямоугольники точно по линиям)
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            
            for (let i = 0; i <= cols; i++) {
                const x = i * (TILE_SIZE + GAP_SIZE) - GAP_SIZE/2;
                ctx.fillRect(x, 0, GAP_SIZE, canvas.height);
            }
            for (let j = 0; j <= rows; j++) {
                const y = j * (TILE_SIZE + GAP_SIZE) - GAP_SIZE/2;
                ctx.fillRect(0, y, canvas.width, GAP_SIZE);
            }
            
            ctx.shadowBlur = 0; // Сброс эффектов
        }

        // Запуск при загрузке и изменении размера экрана
        window.addEventListener('resize', resize);
        resize(); 

    </script>
</body>
</html>
