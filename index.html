<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamino Simulation - Neon Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050a14;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // НАСТРОЙКИ СЕТКИ
        const TILE_SIZE = 30;  // Размер плиты
        const GAP_SIZE = 4;    // Ширина светящейся линии

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMap();
        }

        function drawMap() {
            // 1. Рисуем темный фон (основа для свечения)
            ctx.fillStyle = '#050a14'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Вычисляем сетку
            const cols = Math.ceil(canvas.width / (TILE_SIZE + GAP_SIZE));
            const rows = Math.ceil(canvas.height / (TILE_SIZE + GAP_SIZE));

            // 2. Рисуем серые плиты (с небольшим отступом, чтобы оставить место под линии)
            ctx.fillStyle = '#2a3b4c'; 
            
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * (TILE_SIZE + GAP_SIZE) + GAP_SIZE / 2;
                    const y = j * (TILE_SIZE + GAP_SIZE) + GAP_SIZE / 2;
                    
                    // Рисуем плиту чуть меньше реального размера, чтобы линии были четкими
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }

            // 3. Рисуем СВЕТЯЩИЕСЯ ЛИНИИ
            // Включаем эффект свечения (neon glow)
            ctx.shadowBlur = 15;       // Сила размытия (чем больше, тем шире ореол)
            ctx.shadowColor = '#ffffff'; // Цвет свечения
            ctx.fillStyle = '#ffffff';   // Цвет самой линии (белый)

            // Вертикальные линии
            for (let i = 0; i <= cols; i++) {
                const x = i * (TILE_SIZE + GAP_SIZE);
                ctx.fillRect(x, 0, GAP_SIZE, canvas.height);
            }

            // Горизонтальные линии
            for (let j = 0; j <= rows; j++) {
                const y = j * (TILE_SIZE + GAP_SIZE);
                ctx.fillRect(0, y, canvas.width, GAP_SIZE);
            }

            // Сбрасываем эффекты, чтобы они не влияли на будущие объекты (юнитов)
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        // Запуск
        window.addEventListener('resize', resize);
        resize(); 

    </script>
</body>
</html>
