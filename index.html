<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamino Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2332;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Размер карты (большой!)
        const MAP_WIDTH = 4000;
        const MAP_HEIGHT = 4000;

        // Позиция камеры
        let cameraX = MAP_WIDTH / 2 - window.innerWidth / 2;
        let cameraY = MAP_HEIGHT / 2 - window.innerHeight / 2;

        // Для перемещения пальцем
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function drawMap() {
            // Очистка экрана
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Сохраняем контекст и смещаем камеру
            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Рисуем большую карту
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Граница карты (чтобы видеть края)
            ctx.strokeStyle = '#2a3b4c';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            ctx.restore();
        }

        // Управление камерой (перемещение пальцем)
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            cameraX -= (currentX - lastX);
            cameraY -= (currentY - lastY);
            
            lastX = currentX;
            lastY = currentY;
            
            drawMap();
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Для мыши (тестирование на ПК)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            cameraX -= (e.clientX - lastX);
            cameraY -= (e.clientY - lastY);
            
            lastX = e.clientX;
            lastY = e.clientY;
            
            drawMap();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Запуск
        window.addEventListener('resize', resize);
        resize();
        drawMap();

    </script>
</body>
</html>
