<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamino Simulation - Outposts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2332;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">Зум: <span id="zoomLevel">100%</span></div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const zoomDisplay = document.getElementById('zoomLevel');

        // Размер карты
        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 1200;

        // Позиция камеры
        let cameraX = MAP_WIDTH / 2 - window.innerWidth / 2;
        let cameraY = MAP_HEIGHT / 2 - window.innerHeight / 2;
        let zoom = 1; // Масштаб (1 = 100%)

        // Для перемещения пальцем
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        // Для зума (pinch)
        let initialPinchDistance = 0;
        let initialZoom = 1;

        // Аванпосты (цвета поменяны: Республика - красная, КНС - синяя)
        const outposts = {
            republic: {
                x: 1600,
                y: 600,
                color: '#ff3030', // Красный
                name: 'РЕСПУБЛИКА'
            },
            cis: {
                x: 400,
                y: 600,
                color: '#4a9eff', // Синий
                name: 'КНС'
            }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMap();
        }

        function drawBuilding(x, y, width, height, color, name) {
            // Тень здания
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(x + 8, y + 8, width, height);

            // Основное здание
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);

            // Обводка
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);

            // Внутренняя деталь
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(x + 15, y + 15, width - 30, height - 30);

            // Название
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name, x + width / 2, y - 15);
        }

        function drawMap() {
            // Очистка экрана
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            
            // Применяем зум и камеру
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);
            ctx.translate(-cameraX, -cameraY);

            // Рисуем карту
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Граница карты
            ctx.strokeStyle = '#2a3b4c';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Рисуем аванпосты
            const buildingSize = 180;
            
            drawBuilding(
                outposts.cis.x - buildingSize / 2,
                outposts.cis.y - buildingSize / 2,
                buildingSize,
                buildingSize,
                outposts.cis.color,
                outposts.cis.name
            );

            drawBuilding(
                outposts.republic.x - buildingSize / 2,
                outposts.republic.y - buildingSize / 2,
                buildingSize,
                buildingSize,
                outposts.republic.color,
                outposts.republic.name
            );

            ctx.restore();

            // Обновляем отображение зума
            zoomDisplay.textContent = Math.round(zoom * 100) + '%';
        }

        // Вычисление расстояния между двумя точками касания
        function getDistance(touch1, touch2) {
            return Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
        }

        // Управление камерой (перемещение)
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                // Начало pinch-жеста
                isDragging = false;
                initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
                initialZoom = zoom;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 1 && isDragging) {
                // Перемещение камеры
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                
                cameraX -= (currentX - lastX) / zoom;
                cameraY -= (currentY - lastY) / zoom;
                
                lastX = currentX;
                lastY = currentY;
                
                drawMap();
            } else if (e.touches.length === 2) {
                // Pinch-зум
                const currentDistance = getDistance(e.touches[0], e.touches[1]);
                const scale = currentDistance / initialPinchDistance;
                
                zoom = Math.max(0.3, Math.min(3, initialZoom * scale)); // Ограничение зума от 30% до 300%
                
                drawMap();
            }
        });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                isDragging = false;
            }
        });

        // Для мыши (тестирование на ПК)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            cameraX -= (e.clientX - lastX) / zoom;
            cameraY -= (e.clientY - lastY) / zoom;
            
            lastX = e.clientX;
            lastY = e.clientY;
            
            drawMap();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Зум колесиком мыши
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.1;
            
            if (e.deltaY < 0) {
                zoom = Math.min(3, zoom + zoomSpeed);
            } else {
                zoom = Math.max(0.3, zoom - zoomSpeed);
            }
            
            drawMap();
        });

        // Запуск
        window.addEventListener('resize', resize);
        resize();
        drawMap();

    </script>
</body>
</html>
